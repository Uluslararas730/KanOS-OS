<title>KanOS</title>
<style>
:root{--b:1vmin;--bg:#0d121f;--yz:#1f263d;--bs:#2b3554;--vu:#5c85ff;--so:#b3bfd9;--k:#ed5454;--s:#fac433;--y:#4dc78c;--g:#384569;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#0d121f;color:#eef;font:600 calc(var(--b)*3.6)/1.25 -apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}
[hidden]{display:none!important}
#os{position:relative;height:100%;overflow:hidden;background:linear-gradient(#293366,#0a0f1f)}
button{font:inherit;font-weight:700;color:#fff;border:0;border-radius:calc(var(--b)*2);background:var(--g);padding:calc(var(--b)*1.5);min-height:calc(var(--b)*8)}
button:active{filter:brightness(.7)}.v{background:var(--vu)}.y{background:var(--y)}.k{background:var(--k)}.s{background:var(--s);color:#222}
input,textarea{font:16px -apple-system,system-ui,sans-serif;color:#fff;background:#141a2e;border:1px solid var(--g);border-radius:calc(var(--b)*2);padding:calc(var(--b)*2);width:100%;-webkit-user-select:text;user-select:text;resize:none;outline:0}
input[type=range]{padding:0;border:0;background:none}
.row{display:flex;gap:var(--b);flex:none}.row>*{flex:1;min-width:0}.g{display:grid;gap:var(--b)}.f{flex:1;min-height:0}
.mu{color:var(--so);font-size:.85em}.big{font-size:calc(var(--b)*10);font-weight:800;text-align:center;flex:1;display:flex;align-items:center;justify-content:center}
.list{overflow:auto;display:flex;flex-direction:column;gap:calc(var(--b)*.6)}.list button{text-align:left;flex:none}
.term{margin:0;overflow:auto;font:calc(var(--b)*3.2)/1.3 ui-monospace,Menlo,monospace;color:#d9f2e6;white-space:pre-wrap;-webkit-user-select:text;user-select:text;word-break:break-all}
#big{position:absolute;right:calc(var(--b)*3);bottom:calc(var(--b)*12);text-align:right;font-size:calc(var(--b)*14);font-weight:800;line-height:1;opacity:.9;pointer-events:none}#big small{display:block;font-size:calc(var(--b)*3.6);font-weight:600;margin-top:var(--b)}
#ic{position:absolute;inset:0 0 calc(var(--b)*10) 0;padding:calc(var(--b)*3) calc(var(--b)*2);grid-template-columns:repeat(auto-fill,minmax(calc(var(--b)*24),1fr));align-content:start;overflow:auto}
.ik{background:none;display:flex;flex-direction:column;align-items:center;gap:var(--b);padding:0;font-size:calc(var(--b)*3.2)}.ik i{width:calc(var(--b)*17);height:calc(var(--b)*17);border-radius:calc(var(--b)*4);display:flex;align-items:center;justify-content:center;font:800 calc(var(--b)*7)/1 system-ui;font-style:normal}
#wins{position:absolute;inset:0 0 calc(var(--b)*10) 0;pointer-events:none;overflow:hidden}
.w{position:absolute;display:flex;flex-direction:column;pointer-events:auto;background:var(--yz);border-radius:calc(var(--b)*3);box-shadow:0 .6vmin 3vmin #0008;overflow:hidden}
.w.m{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.h{height:calc(var(--b)*8);flex:none;background:var(--bs);display:flex;align-items:center;gap:0;padding:0 var(--b);touch-action:none;font-weight:800}
.h b{width:calc(var(--b)*8);height:calc(var(--b)*8);display:flex;align-items:center;justify-content:center}.h b:after{content:"";width:calc(var(--b)*4.6);height:calc(var(--b)*4.6);border-radius:50%;background:var(--c)}

panel.innerHTML='<b>Hızlı ayarlar</b><div class="g" id="pg" style="grid-template-columns:repeat(3,1fr)"></div><div id="ps"></div><div class="row" id="pb"></div>';

[['İmleç','cur'],['İz','iz']].forEach(([n,k])=>{const b=toggle(n,k,null,$('#pg'));b.style.fontSize='.8em'});slider('Parlaklık','par',.15,1,dim,$('#ps'));btn('Kilitle','v',()=>kilitle(),$('#pb'));btn('Ayarlar','',()=>ac('Ayarlar'),$('#pb'));

 const ok=()=>{l.style.opacity=0;setTimeout(()=>l.hidden=true,300);bildir('Hoş geldin',tarih())};

const cv=$('#cv'),cx=cv.getContext('2d');let px=null,py,tz=[],ring=0,raf=0,lt=0;
function cdr(t){const d=devicePixelRatio||1;if(cv.width!=innerWidth*d){cv.width=innerWidth*d;cv.height=innerHeight*d}cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,innerWidth,innerHeight);raf=0;if(px==null||!S.cur)return;

const cr=()=>{raf||(raf=requestAnimationFrame(cdr))};
